name: Парсинг и публикация сайта

on:
  schedule:
    # Минуты «нечётные»: на начало часа у GitHub пик нагрузки, и расписание часто пропускается
    - cron: "17,47 * * * *"  # дважды в час — etp.adilet (арестованное имущество), канал, бот
    - cron: "13 22 * * *"    # 04:13 по Алматы — банки и E-Qazyna
  workflow_dispatch:
    inputs:
      sources:
        description: "Источники через пробел (adilet sauda halyk alatau forte bcc freedom eurasian nurbank bereke rbk); пусто — только пересобрать сайт"
        required: false
        default: ""
      refresh_posts:
        description: "Переписать уже опубликованные посты канала по текущему шаблону"
        type: boolean
        default: false
      full:
        description: "Заново загрузить детали всех лотов выбранных источников (документы, координаты, контакты)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["backend/**", "web/**", "worker/**", ".github/workflows/**"]

permissions:
  contents: write   # релиз «data» хранит базу SQLite между запусками
  pages: write
  id-token: write

concurrency:
  group: torgi-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      TORGI_DATABASE_URL: sqlite:///${{ github.workspace }}/torgi.db
      PYTHONIOENCODING: utf-8
      # Telegram: секрет TORGI_TELEGRAM_BOT_TOKEN и переменная TORGI_TELEGRAM_CHANNEL в настройках репозитория
      TORGI_TELEGRAM_BOT_TOKEN: ${{ secrets.TORGI_TELEGRAM_BOT_TOKEN }}
      TORGI_TELEGRAM_CHANNEL: ${{ vars.TORGI_TELEGRAM_CHANNEL }}
      # Дополнительные каналы (JSON {"@канал": {"region": "Алматы"}}) и администраторы бота (username через запятую)
      TORGI_TELEGRAM_CHANNELS: ${{ vars.TORGI_TELEGRAM_CHANNELS }}
      TORGI_TELEGRAM_ADMINS: ${{ vars.TORGI_TELEGRAM_ADMINS }}
      # Cloudflare (вход на сайте и закрытые контакты): секрет CLOUDFLARE_API_TOKEN и переменная
      # CLOUDFLARE_ACCOUNT_ID. Пока токена нет — сайт открытый, как раньше.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # Письма о новых лотах (Brevo): секрет BREVO_API_KEY. Работает вместе с Cloudflare — подписки лежат в D1
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Скачать базу из релиза «data»
        run: |
          if gh release download data --pattern torgi.db.gz --dir . 2>/dev/null; then
            gunzip -f torgi.db.gz && ls -la torgi.db
          else
            echo "Базы ещё нет — будет первый полный парсинг"
          fi
          # сводные рыночные цены м² для раздела «ТОП» (обновляет workflow «Рыночные цены»)
          gh release download data --pattern market-index.json --dir . 2>/dev/null || echo "Рыночных цен ещё нет — ТОП будет пустым"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Зависимости backend
        working-directory: backend
        run: uv sync --frozen

      - name: Парсинг
        id: parse
        working-directory: backend
        run: |
          case "${{ github.event_name }}|${{ github.event.schedule }}" in
            "schedule|17,47 * * * *") SOURCES="adilet" ;;
            "schedule|13 22 * * *") SOURCES="sauda halyk alatau forte bcc freedom eurasian nurbank bereke rbk" ;;
            workflow_dispatch*)    SOURCES="${{ inputs.sources }}" ;;
            *)                     SOURCES="" ;;
          esac
          [ -f ../torgi.db ] || SOURCES="adilet sauda halyk alatau forte bcc freedom eurasian nurbank bereke rbk"
          echo "sources=$SOURCES" >> "$GITHUB_OUTPUT"
          if [ -n "$SOURCES" ]; then
            FULL=""; [ "${{ inputs.full }}" = "true" ] && FULL="--full"
            uv run python -m torgi.cli parse $FULL $SOURCES \
              || echo "::warning::Часть источников завершилась с ошибкой — см. лог выше"
          fi

      - name: Сохранить базу в релиз «data»
        if: steps.parse.outputs.sources != ''
        run: |
          gzip -kf torgi.db
          gh release view data >/dev/null 2>&1 || gh release create data --title "База данных" \
            --notes "SQLite-база лотов, обновляется автоматически workflow «Парсинг и публикация сайта»." --latest=false
          gh release upload data torgi.db.gz --clobber

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Закрытый режим: адрес, контакты, ссылка на источник, документы и описание — только после входа.
      # Их отдаёт worker на Cloudflare (worker/), данные лежат в D1.
      - name: Cloudflare — база D1 и API
        id: cf
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.TORGI_TELEGRAM_BOT_TOKEN != ''
        working-directory: worker
        run: |
          set -euo pipefail
          WR="npx --yes wrangler@4"
          CF="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          DB_ID=$(curl -fsS -H "$AUTH" "$CF/d1/database?name=torgi" | jq -r '.result[] | select(.name=="torgi") | .uuid' | head -1)
          if [ -z "$DB_ID" ]; then
            DB_ID=$(curl -fsS -X POST -H "$AUTH" -H "Content-Type: application/json" \
              -d '{"name":"torgi"}' "$CF/d1/database" | jq -r .result.uuid)
          fi
          sed -i "s/__D1_DATABASE_ID__/$DB_ID/" wrangler.toml
          $WR d1 execute torgi --remote --file schema.sql
          # поддомен workers.dev регистрируется один раз
          SUB=$(curl -fsS -H "$AUTH" "$CF/workers/subdomain" | jq -r '.result.subdomain // empty' || true)
          if [ -z "$SUB" ]; then
            SUB=$(curl -fsS -X PUT -H "$AUTH" -H "Content-Type: application/json" \
              -d '{"subdomain":"torgi-kz"}' "$CF/workers/subdomain" | jq -r .result.subdomain)
          fi
          $WR deploy
          printf '%s' "$TORGI_TELEGRAM_BOT_TOKEN" | $WR secret put BOT_TOKEN
          if [ -n "$BREVO_API_KEY" ]; then printf '%s' "$BREVO_API_KEY" | $WR secret put BREVO_API_KEY; fi
          echo "db_id=$DB_ID" >> "$GITHUB_OUTPUT"
          echo "api_url=https://torgi-api.$SUB.workers.dev" >> "$GITHUB_OUTPUT"

      - name: Выгрузка JSON для сайта
        working-directory: backend
        env:
          CF_D1_DATABASE_ID: ${{ steps.cf.outputs.db_id }}
        run: |
          if [ -n "$CF_D1_DATABASE_ID" ]; then
            uv run python -m torgi.cli export --gated ../web/data --market ../market-index.json
            uv run python -m torgi.cli sync-private ../web/data/private.json
            rm ../web/data/private.json
          else
            uv run python -m torgi.cli export ../web/data --market ../market-index.json
          fi
      - name: Сборка сайта
        working-directory: web
        env:
          # Переменные репозитория (Settings → Secrets and variables → Actions → Variables):
          # номер счётчика Яндекс.Метрики и ссылка на Telegram-канал — пустые значения просто отключают блоки
          NEXT_PUBLIC_YM_ID: ${{ vars.NEXT_PUBLIC_YM_ID }}
          NEXT_PUBLIC_TELEGRAM_URL: ${{ vars.NEXT_PUBLIC_TELEGRAM_URL }}
          NEXT_PUBLIC_TELEGRAM_BOT: ${{ vars.NEXT_PUBLIC_TELEGRAM_BOT }}
          # закрытый режим включается, только когда worker на Cloudflare опубликован
          NEXT_PUBLIC_API_URL: ${{ steps.cf.outputs.api_url }}
          NEXT_PUBLIC_PAYWALL: ${{ steps.cf.outputs.api_url != '' && '1' || '' }}
          NEXT_PUBLIC_AUTH: ${{ steps.cf.outputs.api_url != '' && '1' || '' }}
          NEXT_PUBLIC_EMAIL: ${{ steps.cf.outputs.api_url != '' && env.BREVO_API_KEY != '' && '1' || '' }}
        run: npm ci --no-audit --no-fund && npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out
      - name: Публикация на GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Telegram — канал и бот подписок
        if: env.TORGI_TELEGRAM_BOT_TOKEN != '' && steps.parse.outputs.sources != ''
        working-directory: backend
        run: |
          if [ -n "$TORGI_TELEGRAM_CHANNEL" ]; then
            if [ "${{ inputs.refresh_posts }}" = "true" ]; then
              uv run python -m torgi.cli post --refresh || echo "::warning::Не удалось переписать посты"
            fi
            uv run python -m torgi.cli post --limit 5 || echo "::warning::Публикация в канал не удалась"
          fi
          uv run python -m torgi.cli bot --check || echo "::warning::Токен бота не принят Telegram — проверьте секрет TORGI_TELEGRAM_BOT_TOKEN"
          uv run python -m torgi.cli bot || echo "::warning::Бот подписок завершился с ошибкой"
          gzip -kf ../torgi.db && gh release upload data ../torgi.db.gz --clobber

      - name: Письма о новых лотах по подпискам с сайта
        if: env.BREVO_API_KEY != '' && steps.cf.outputs.db_id != '' && steps.parse.outputs.sources != ''
        working-directory: backend
        env:
          CF_D1_DATABASE_ID: ${{ steps.cf.outputs.db_id }}
          TORGI_API_URL: ${{ steps.cf.outputs.api_url }}
        run: uv run python -m torgi.cli email || echo "::warning::Рассылка писем завершилась с ошибкой"

      # GitHub отключает расписание в репозитории без коммитов 60 дней — раз в 50 дней отмечаемся
      - name: Не дать отключить расписание
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive: расписание обновлений активно"
            git push
          fi
