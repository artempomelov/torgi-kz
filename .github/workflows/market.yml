name: Рыночные цены (krisha.kz, aster.kz)

# Раз в неделю: цены предложения с krisha.kz → сводные цены м² по городам и районам (market-index.json),
# с aster.kz → цены машин по модели и году (car-market-index.json) — в релизе «data». Объявления не сохраняются —
# только медианы. По ним сайт строит раздел «ТОП» и плашки «−N% к рынку».
on:
  schedule:
    - cron: "41 19 * * 0"  # воскресенье, 01:41 по Алматы
  workflow_dispatch:
    inputs:
      only:
        description: "Что собрать"
        type: choice
        options: [all, krisha, cars]
        default: all

permissions:
  contents: write

jobs:
  market:
    if: inputs.only != 'cars'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Зависимости backend
        working-directory: backend
        run: uv sync --frozen
      - name: Сбор цен и сводка
        working-directory: backend
        run: |
          # с 18.11.2026 Крыша отвечает серверам GitHub 403: сбор сразу останавливается, сводка остаётся прошлой,
          # свежие цены собираются с компьютера владельца — backend/scripts/market-local.ps1
          uv run python -m torgi.cli market collect
          # прошлая сводка: город, где сбор не удался (Крыша ограничила запросы), берём из неё, а не оставляем без оценки
          gh release download data --pattern market-index.json --output ../prev-market-index.json || echo "прошлой сводки нет"
          uv run python -m torgi.cli market index --out ../market-index.json --prev ../prev-market-index.json
          # меньше 200 сегментов — сбор не удался, а прошлой сводки нет: старую сводку не трогаем
          n=$(python3 -c "import json; print(len(json.load(open('../market-index.json'))['segments']))")
          echo "сегментов: $n"
          [ "$n" -ge 200 ] || { echo "::error::Слишком мало данных ($n сегментов)"; exit 1; }
          # письмо о сбое — только когда цены устарели больше чем на две недели; раньше — предупреждение в запуске
          age=$(python3 -c "import json, datetime as d; u = json.load(open('../market-index.json')).get('updated_at') or '2000-01-01T00:00:00+00:00'; print((d.datetime.now(d.timezone.utc) - d.datetime.fromisoformat(u)).days)")
          echo "сводке дней: $age"
          if [ "$age" -gt 14 ]; then
            echo "::error::Цены Крыши не обновлялись $age дн.: Крыша не пускает серверы GitHub. Соберите с компьютера: backend/scripts/market-local.ps1"
            exit 1
          elif [ "$age" -ge 1 ]; then
            echo "::warning::Крыша не отдала новых объявлений — оставлена сводка $age-дневной давности. Свежие цены — с компьютера: backend/scripts/market-local.ps1"
          fi
      - name: Сохранить в релиз «data»
        run: gh release upload data market-index.json --clobber

  # Параллельно: цены машин с пробегом на aster.kz → медианы по модели и году (car-market-index.json)
  cars:
    if: inputs.only != 'krisha'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Зависимости backend
        working-directory: backend
        run: uv sync --frozen
      - name: Сбор цен машин и сводка
        working-directory: backend
        run: |
          uv run python -m torgi.cli market cars --out ../car-market-index.json
          n=$(python3 -c "import json; print(len(json.load(open('../car-market-index.json'))['segments']))")
          echo "сегментов: $n"
          [ "$n" -ge 300 ] || { echo "::error::Слишком мало данных ($n сегментов)"; exit 1; }
      - name: Сохранить в релиз «data»
        run: gh release upload data car-market-index.json --clobber
