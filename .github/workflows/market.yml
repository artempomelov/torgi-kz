name: Рыночные цены (krisha.kz, aster.kz)

# Раз в неделю: цены предложения с krisha.kz → сводные цены м² по городам и районам (market-index.json),
# с aster.kz → цены машин по модели и году (car-market-index.json) — в релизе «data». Объявления не сохраняются —
# только медианы. По ним сайт строит раздел «ТОП» и плашки «−N% к рынку».
on:
  schedule:
    - cron: "41 19 * * 0"  # воскресенье, 01:41 по Алматы
  workflow_dispatch:
    inputs:
      only:
        description: "Что собрать"
        type: choice
        options: [all, krisha, cars]
        default: all

permissions:
  contents: write

jobs:
  market:
    if: inputs.only != 'cars'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Зависимости backend
        working-directory: backend
        run: uv sync --frozen
      - name: Сбор цен и сводка
        working-directory: backend
        run: |
          uv run python -m torgi.cli market collect
          uv run python -m torgi.cli market index --out ../market-index.json
          # меньше 200 сегментов — сбор не удался (например, сайт ограничил запросы): старую сводку не трогаем
          n=$(python3 -c "import json; print(len(json.load(open('../market-index.json'))['segments']))")
          echo "сегментов: $n"
          [ "$n" -ge 200 ] || { echo "::error::Слишком мало данных ($n сегментов)"; exit 1; }
      - name: Сохранить в релиз «data»
        run: gh release upload data market-index.json --clobber

  # Параллельно: цены машин с пробегом на aster.kz → медианы по модели и году (car-market-index.json)
  cars:
    if: inputs.only != 'krisha'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Зависимости backend
        working-directory: backend
        run: uv sync --frozen
      - name: Сбор цен машин и сводка
        working-directory: backend
        run: |
          uv run python -m torgi.cli market cars --out ../car-market-index.json
          n=$(python3 -c "import json; print(len(json.load(open('../car-market-index.json'))['segments']))")
          echo "сегментов: $n"
          [ "$n" -ge 300 ] || { echo "::error::Слишком мало данных ($n сегментов)"; exit 1; }
      - name: Сохранить в релиз «data»
        run: gh release upload data car-market-index.json --clobber
