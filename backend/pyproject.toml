[project]
name = "torgi"
version = "0.1.0"
description = "torgi.kz — агрегатор торгов недвижимостью в Казахстане: парсеры, база, API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[dependency-groups]
dev = ["pytest>=8.3"]

[project.scripts]
torgi = "torgi.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Smart App Control в Windows блокирует неподписанные DLL портативных сборок Python —
# используем установленный официальный Python.
python-preference = "only-system"

[tool.pytest.ini_options]
testpaths = ["tests"]
