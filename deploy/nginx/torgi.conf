# torgi.kz — основной домен. vsetorgi.kz и torgi-nedvizhimost.kz — 301 на torgi.kz.
# Сертификаты: certbot certonly --nginx -d torgi.kz -d www.torgi.kz -d vsetorgi.kz -d www.vsetorgi.kz \
#              -d torgi-nedvizhimost.kz -d www.torgi-nedvizhimost.kz

# HTTP → HTTPS для всех доменов
server {
    listen 80;
    listen [::]:80;
    server_name torgi.kz www.torgi.kz vsetorgi.kz www.vsetorgi.kz
                torgi-nedvizhimost.kz www.torgi-nedvizhimost.kz;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://torgi.kz$request_uri; }
}

# Вспомогательные домены и www → https://torgi.kz (сохраняем путь и UTM-метки)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.torgi.kz vsetorgi.kz www.vsetorgi.kz torgi-nedvizhimost.kz www.torgi-nedvizhimost.kz;
    ssl_certificate     /etc/letsencrypt/live/torgi.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/torgi.kz/privkey.pem;
    return 301 https://torgi.kz$request_uri;
}

# Основной сайт
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name torgi.kz;
    ssl_certificate     /etc/letsencrypt/live/torgi.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/torgi.kz/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API (FastAPI, uvicorn на 8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Сайт — статическая сборка Next.js (deploy/rebuild-site.sh)
    root /opt/torgi/web/out;
    error_page 404 /404.html;
    location / {
        try_files $uri $uri/ =404;
    }
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
